name: PersephoneV1

options:
  bundleIdPrefix: com.victor
  deploymentTarget:
    iOS: "17.0"

targets:
  PersephoneV1:
    type: application
    platform: iOS
    sources:
      - PersephoneV1
    resources:
      - PersephoneV1/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.victor.PersephoneV1
        PRODUCT_NAME: Persephone
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: PersephoneV1/Info.plist
      properties:
        CFBundleDisplayName: Persephone
        NSMicrophoneUsageDescription: "Persephone uses the microphone when you choose to speak with her."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: false
